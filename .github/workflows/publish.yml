# A version tag publishes that version: tag v1.2.3 on a commit whose package.json says 1.2.3.
# npm's side is set on the package's page: Settings, Trusted publishing, this file.
name: Publish
on:
  push: { tags: ['v*'] }
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # Trusted publishing: npm trusts this workflow, so there is no token to store.
      - run: npm publish
